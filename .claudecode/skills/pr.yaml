name: pr
description: Merge main into staging and create PR to merge staging into main
instructions: |
  Merge main into staging to ensure there are no merge conflicts. If there aren't any or once they're resolved, create a pr to merge staging into main

  Include in our PR description a summary of all of the commits or changes that we recently merged into staging. A brief summary. Being concise is good.

  Then always give me a clickable link to the pull request URL on github.
