# Separate distribution identity; project.yml remains the local device build.
include:
  - project.yml
name: FieldTheoryAppStore
targets:
  FieldTheory:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afar1.littleai
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "50"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Field Theory TestFlight 2026-09-13
    info:
      path: .app-store/FieldTheory-Info.plist
  RecordingWidget:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afar1.littleai.recording
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "50"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Field Theory Recording App Store 2026-09-19
    info:
      path: .app-store/RecordingWidget-Info.plist
