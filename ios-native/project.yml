name: FieldTheory
options:
  bundleIdPrefix: com.afar1
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.4.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.6
targets:
  FieldTheoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FieldTheory/Tests
        excludes: [GoalsTests.swift]
    dependencies:
      - target: FieldTheory
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  FieldTheoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FieldTheory/UITests
    dependencies:
      - target: FieldTheory
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  FieldTheory:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - FieldTheoryTests
        - FieldTheoryUITests
    sources:
      - path: RecordingShared
      - path: FieldTheory/Sources
        excludes: [Goals]
      - path: FieldTheory/Resources
        excludes: [goals-cards.json]
    dependencies:
      - target: RecordingWidget
        embed: true
      - package: Supabase
        product: Supabase
      - package: Markdown
        product: Markdown
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afar1.fieldtheory
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "25"
        FT_BUILD_COMMIT: development
        DEVELOPMENT_TEAM: 3244UJ94D8
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: FieldTheory/Resources/Info.plist
      properties:
        CFBundleDisplayName: Field Theory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FTBuildCommit: $(FT_BUILD_COMMIT)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.afar1.fieldtheory.voice.transcription]
        NSMicrophoneUsageDescription: "Field Theory records audio so it can transcribe your voice entirely on this device."
        UIAppFonts:
          - SourceSerif4-Variable.ttf
          - SourceSerif4-Italic-Variable.ttf
          - SourceSans3-Variable.ttf
          - SourceSans3-Italic-Variable.ttf
          - SourceCodePro-Variable.ttf
          - SourceCodePro-Italic-Variable.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false

  RecordingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RecordingWidget
      - path: RecordingShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afar1.fieldtheory.recording
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "25"
        DEVELOPMENT_TEAM: 3244UJ94D8
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: RecordingWidget/Info.plist
      properties:
        CFBundleDisplayName: Field Theory Recording
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
