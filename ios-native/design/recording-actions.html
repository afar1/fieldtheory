<div id="ft-recording-design" aria-label="Field Theory recording action concepts">
  <style>
    #ft-recording-design {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:light-dark(#262626,#ededed);padding:12px 0;}
    #ft-recording-design .variant {margin:0 auto 26px;max-width:390px;}
    #ft-recording-design .caption {font-size:12px;font-weight:500;margin:0 12px 10px;color:light-dark(#575757,#bcbcbc);}
    #ft-recording-design .island {background:#080808;color:#fff;border-radius:36px;padding:22px 20px 18px;box-shadow:0 8px 24px #0002;}
    #ft-recording-design .header {display:flex;align-items:center;gap:10px;margin:0 4px 20px;}
    #ft-recording-design .mic {color:#ff9c48;width:20px;height:20px;}
    #ft-recording-design .name {font-size:14px;font-weight:600;}
    #ft-recording-design .sub {font-size:12px;color:#b7b7b7;margin-top:4px;}
    #ft-recording-design .timer {margin-left:auto;font:500 22px ui-monospace,monospace;letter-spacing:-1px;}
    #ft-recording-design .actions {display:flex;gap:10px;align-items:center;}
    #ft-recording-design button {font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;}
    #ft-recording-design .action {display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:24px;border:1px solid #454545;background:#262626;color:#fff;flex:1;}
    #ft-recording-design .action svg {width:19px;height:19px;flex-shrink:0;}
    #ft-recording-design .cancel {flex:0 0 48px;width:48px;}
    #ft-recording-design .send {background:#fff;border-color:#fff;color:#111;}
    #ft-recording-design .feedback {min-height:18px;font-size:12px;color:#c3c3c3;margin:12px 6px 0;text-align:center;}
    #ft-recording-design .icons .action:not(.cancel) {flex:0 0 64px;}
    #ft-recording-design .icons .actions {justify-content:space-between;}
    #ft-recording-design .reset {display:block;background:none;border:0;color:light-dark(#555,#bbb);text-decoration:underline;margin:8px auto;padding:8px;}
  </style>
  <section class="variant" aria-label="Icons with short labels">
    <div class="caption">Recommended · icons + short labels</div>
    <div class="island">
      <div class="header"><i data-lucide="mic" class="mic" aria-hidden="true"></i><div><div class="name">Field Theory</div><div class="sub">Finish recording</div></div><div class="timer">01:24</div></div>
      <div class="actions">
        <button class="action cancel" type="button" data-action="cancel" aria-label="Cancel recording"><i data-lucide="x" aria-hidden="true"></i></button>
        <button class="action" type="button" data-action="copy" aria-label="Finish recording and copy transcript"><i data-lucide="copy" aria-hidden="true"></i><span>Copy</span></button>
        <button class="action send" type="button" data-action="send" aria-label="Finish recording and send transcript to computer"><i data-lucide="send" aria-hidden="true"></i><span>Send</span></button>
      </div>
      <div class="feedback" aria-live="polite">Choose what happens after transcription</div>
    </div>
  </section>
  <section class="variant icons" aria-label="Icons only alternative">
    <div class="caption">Alternative · icons only</div>
    <div class="island">
      <div class="header"><i data-lucide="mic" class="mic" aria-hidden="true"></i><div><div class="name">Field Theory</div><div class="sub">Finish recording</div></div><div class="timer">01:24</div></div>
      <div class="actions">
        <button class="action cancel" type="button" data-action="cancel" aria-label="Cancel recording"><i data-lucide="x" aria-hidden="true"></i></button>
        <button class="action" type="button" data-action="copy" aria-label="Finish recording and copy transcript"><i data-lucide="copy" aria-hidden="true"></i></button>
        <button class="action send" type="button" data-action="send" aria-label="Finish recording and send transcript to computer"><i data-lucide="send" aria-hidden="true"></i></button>
      </div>
      <div class="feedback" aria-live="polite">Choose what happens after transcription</div>
    </div>
  </section>
  <button class="reset" type="button">Reset preview</button>
</div>
<script>
(function(){
 const root=document.getElementById('ft-recording-design');
 const descriptions={cancel:'Ask whether to discard this recording',copy:'Finish → transcribe → copy text',send:'Finish → transcribe → send to computer'};
 root.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
  button.closest('.island').querySelector('.feedback').textContent=descriptions[button.dataset.action];
 }));
 root.querySelector('.reset').addEventListener('click',()=>root.querySelectorAll('.feedback').forEach(x=>x.textContent='Choose what happens after transcription'));
 const state={sendEmphasis:true};
 function render(){root.querySelectorAll('[data-action="send"]').forEach(x=>x.classList.toggle('send',state.sendEmphasis));}
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'sendEmphasis',{label:'Emphasize Send'});}
})();
</script>
